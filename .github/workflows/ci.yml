name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned (not `latest`): the eval baseline is latency-sensitive enough
      # that a Bun runtime bump could shift numbers; bump deliberately.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (all packages)
        run: bun test

      # Full eval run against the frozen baseline. Compression-ratio and
      # recall gates are enforced; the p95-latency gate is skipped because
      # shared runners are too noisy for a 2x wall-clock bound.
      - name: Eval regression gate
        env:
          EVAL_SKIP_LATENCY: "1"
        run: |
          bun run eval
          bun run eval --check
