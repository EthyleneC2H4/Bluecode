name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned (not `latest`): the eval baseline is latency-sensitive enough
      # that a Bun runtime bump could shift numbers; bump deliberately.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (all packages)
        run: bun test

      # Workspace package graph must match the documented dependency
      # direction exactly (CONTRIBUTING.md); cheap enough to run every push.
      - name: Dependency direction
        run: bun scripts/check-dependency-direction.ts

      - name: Host bundle excludes SQLite
        run: bun run check:host

      # One fresh full replay gates absolute reliability and relative regression.
      # Shared runner latency is reported but hardware-sensitive p95 is not a wall gate.
      - name: Full plugin replay reliability and regression gate
        env:
          EVAL_SKIP_LATENCY: "1"
          EVAL_REPORT_PATH: ${{ runner.temp }}/eval-report.json
        run: bun run eval --check --benchmarks

      - name: Publish evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}
          path: ${{ runner.temp }}/eval-report.json
          if-no-files-found: warn
